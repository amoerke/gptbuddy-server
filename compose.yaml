
services:
  gptbuddy-server:
    container_name: gptbuddy-server
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    ports:
    - '${PORT:-8791}:3000'
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - 'http://127.0.0.1:3000/healthz'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
